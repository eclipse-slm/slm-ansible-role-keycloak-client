### Inputs
- name: "KEYCLOAK_CLIENT | Assert inputs | get_oidc-keycloak-json.yml"
  ansible.builtin.assert:
    that:
      - (keycloak.url.external is defined) and (keycloak.url.external|length > 0)               # Auth URL of the Keycloak instance
      - (_keycloak_access_token is defined) and (_keycloak_access_token|length > 0)     # Access token to authenticate with Keycloak
      - (_keycloak_realm_name is defined) and (_keycloak_realm_name|length > 0)         # Name of the Keycloak realm the client belongs to
      - (client_id is defined) and (client_id|length > 0)                               # Id of the client

- name: "KEYCLOAK_CLIENT | Get Keycloak client details of '{{ client_id }}'"
  ansible.builtin.uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/clients?clientId={{ client_id }}"
    validate_certs: false
    method: GET
    headers:
      authorization: "Bearer {{ keycloak_access_token }}"
  register: keycloak_response

- name: "KEYCLOAK_CLIENT | Set fact for Keycloak client details of '{{ client_id }}'"
  ansible.builtin.set_fact:
    keycloak_client: "{{ keycloak_response.json | first }}"

- name: "KEYCLOAK_CLIENT | Get OIDC Keycloak JSON of '{{ client_id }}'"
  ansible.builtin.uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/clients/{{ keycloak_client.id }}/installation/providers/keycloak-oidc-keycloak-json"
    validate_certs: false
    method: GET
    headers:
      authorization: "Bearer {{ keycloak_access_token }}"
    body_format: json
    return_content: true
  register: keycloak_response

### Outputs
- name: "KEYCLOAK_CLIENT | Set fact for OIDC Keycloak JSON of '{{ client_id }}'"
  ansible.builtin.set_fact:
    keycloak_oidc_json: "{{ keycloak_response.content }}"
