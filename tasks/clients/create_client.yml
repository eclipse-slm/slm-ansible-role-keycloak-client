### Inputs
- name: "Assert inputs of 'keycloak/client | create_client.yml'"
  ansible.builtin.assert:
    that:
      - (keycloak.url.external is defined) and (keycloak.url.external|length > 0)       # Auth URL of the Keycloak instance
      - (_keycloak_access_token is defined) and (_keycloak_access_token|length > 0)     # Access token to authenticate with Keycloak
      - (_keycloak_realm_name is defined) and (_keycloak_realm_name|length > 0)         # Name of the Keycloak realm where the client should be created
      - (_keycloak_client is defined) and (_keycloak_client|length > 0)                 # Definition of the client to be created

- name: "Assert _keycloak_client inputs of 'keycloak/client | create_client.yml'"
  ansible.builtin.assert:
    that:
      - (_keycloak_client.client_id is defined) and (_keycloak_client.client_id|length > 0) # Client ID of the Keycloak client to be created
      - (_keycloak_client.public_client is defined)                                         # Whether the Keycloak client should be public or confidential
      - (_keycloak_client.service_accounts_enabled is defined)                              # Whether service accounts should be enabled for the Keycloak client

### Optional Inputs
# - _keycloak_client_store_config_consul=true|false             # Whether to store the config of the created Keycloak client in Consul (default: true)
# - _keycloak_client.protocol_mappers=...                       # Protocol mappers to be created for the Keycloak client
# - _keycloak_client.assign_client_role_to_service_account=...  # Whether to assign a client role to the service account of the Keycloak client

- name: "Get Keycloak admin access token"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/authentication/get_admin_access_token.yml"

- name: "Create Keycloak client '{{ _keycloak_client.client_id }}'"
  ansible.builtin.uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/clients"
    validate_certs: false
    method: POST
    headers:
      authorization: "Bearer {{ _keycloak_access_token }}"
    body_format: json
    body:
      clientId: "{{ _keycloak_client.client_id }}"
      enabled: true
      protocol: "openid-connect"
      clientAuthenticatorType: "client-secret"
      publicClient: "{{ _keycloak_client.public_client }}"
      serviceAccountsEnabled: "{{ _keycloak_client.service_accounts_enabled }}"
      redirectUris:
        - "*"
      webOrigins:
        - "*"
      attributes:
        post.logout.redirect.uris: "+"
    status_code: 201, 409
  changed_when: output_create_ssp_client.status == 201
  register: output_create_ssp_client

- name: "Get Keycloak client '{{ _keycloak_client.client_id }}' by client ID"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/clients/get_client_by_client_id.yml"
  vars:
    _keycloak_client_id: "{{ _keycloak_client.client_id }}"

- name: "Set client UUID for '{{ _keycloak_client.client_id }}'"
  ansible.builtin.set_fact:
    client_uuid: "{{ keycloak_client.id }}"

- name: "Create protocol mapper 'Groups' for '{{ _keycloak_client.client_id }}'"
  when: (_keycloak_client.protocol_mappers.groups is defined) and (_keycloak_client.protocol_mappers.groups)
  ansible.builtin.uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/clients/{{ client_uuid }}/protocol-mappers/models"
    validate_certs: false
    method: POST
    headers:
      authorization: "Bearer {{ _keycloak_access_token }}"
    body_format: json
    body:
      name: "Groups"
      protocol: "openid-connect"
      protocolMapper: "oidc-group-membership-mapper"
      config:
        full.path: true
        id.token.claim: true
        access.token.claim: true
        claim.name: "groups"
        userinfo.token.claim: true
    status_code: 201, 409
  changed_when: output_create_client_protocol_mapper.status == 201
  register: output_create_client_protocol_mapper

- name: "Create protocol mapper 'Audience' for '{{ _keycloak_client.client_id }}'"
  when: (_keycloak_client.protocol_mappers.audience is defined) and (_keycloak_client.protocol_mappers.audience)
  ansible.builtin.uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/clients/{{ client_uuid }}/protocol-mappers/models"
    validate_certs: false
    method: POST
    headers:
      authorization: "Bearer {{ _keycloak_access_token }}"
    body_format: json
    body:
      name: "Audience"
      protocol: "openid-connect"
      protocolMapper: "oidc-audience-mapper"
      config:
        included.client.audience: "{{ _keycloak_client.client_id }}"
        id.token.claim: "false"
        access.token.claim: "true"
    status_code: 201, 409
  changed_when: output_create_client_protocol_mapper.status == 201
  register: output_create_client_protocol_mapper

- name: "Assign client role 'realm-admin' to service account of client '{{ _keycloak_client.client_id }}'"
  when: _keycloak_client.assign_client_role_to_service_account | default(false)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/roles/assign_client_role_to_service_account"
  vars:
    _client_id: "realm-management"
    _client_role_name: "realm-admin"

- name: "Store config of Keycloak client '{{ _keycloak_client.client_id }}' in Consul"
  when: _keycloak_client_store_config_consul | default(true)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/clients/store_client_config_consul"
  vars:
    client_id: "{{ _keycloak_client.client_id }}"
